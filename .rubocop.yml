AllCops:
  TargetRubyVersion: 3.3
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "tmp/**/*"
    # Fixtures are inputs to the parser, not code the project maintains.
    - "spec/fixtures/**/*"

# The codebase is consistently double-quoted.
Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: true

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"

Metrics/MethodLength:
  Max: 20

Layout/LineLength:
  Max: 110

# Example groups legitimately define constants and long describe blocks.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

# Visitors and the indexing service are cohesive dispatch/orchestration
# classes; splitting them further to satisfy a line count would hurt.
Metrics/ClassLength:
  Max: 120
  Exclude:
    # A Prism visitor's length is its dispatch surface: one method per node
    # type it understands. Splitting that table across classes would make the
    # grammar it handles harder to see, not easier.
    - "lib/devintel/parser/symbol_extractor.rb"

# Test data builders take one keyword per field by design.
Metrics/ParameterLists:
  Exclude:
    - "spec/**/*"
